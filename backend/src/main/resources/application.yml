spring:
  application:
    name: Teamliness
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:teamliness;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info

teamliness:
  ui-theme: GLASSMORPHIC
  living-docs-enabled: true
  workday:
    mode: mock
