spring:
  application:
    name: Teamliness
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/teamliness}
    username: ${SPRING_DATASOURCE_USERNAME:teamliness}
    password: ${SPRING_DATASOURCE_PASSWORD:teamliness_dev_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info

teamliness:
  ui-theme: GLASSMORPHIC
  living-docs-enabled: true
  workday:
    mode: mock
