services:
  postgres:
    image: postgres:16-alpine
    container_name: teamliness-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: teamliness
      POSTGRES_USER: teamliness
      POSTGRES_PASSWORD: teamliness_dev_password
    ports:
      - "5432:5432"
    volumes:
      - teamliness_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamliness -d teamliness"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  teamliness_pgdata:
